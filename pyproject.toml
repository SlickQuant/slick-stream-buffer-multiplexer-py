[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slick-stream-buffer-multiplexer-py"
dynamic = ["version"]
description = "Lock-free MPMC byte stream multiplexer with C++ interoperability via shared memory"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Slick Quant", email = "slickquant@slickquant.com"}
]
keywords = ["stream-buffer", "multiplexer", "lock-free", "atomic", "shared-memory", "ipc", "multiprocessing", "mpmc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "slick-queue-py>=2.1.0",
    "slick-stream-buffer-py>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/SlickQuant/slick-stream-buffer-multiplexer-py"
Documentation = "https://github.com/SlickQuant/slick-stream-buffer-multiplexer-py#readme"
Repository = "https://github.com/SlickQuant/slick-stream-buffer-multiplexer-py"
"Bug Tracker" = "https://github.com/SlickQuant/slick-stream-buffer-multiplexer-py/issues"

[tool.setuptools]
py-modules = ["slick_stream_buffer_multiplexer_py"]

[tool.setuptools.dynamic]
version = {attr = "slick_stream_buffer_multiplexer_py.__version__"}
